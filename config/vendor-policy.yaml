# IronCrew — Vendor Policy
# All model IDs and all OpenRouter hosting providers are allowed by default.
# "*" is an explicit unrestricted selection. Empty lists deny all.
# Operators may configure narrower lists and blocks; existing owner restrictions
# remain in force. Model availability and capabilities are determined by OpenRouter.
version: 1
policy_name: "IronCrew — all models and providers"
allowed_families: ["*"]
blocked_families: []
openrouter:
  # "*" omits only/order from requests; it is never sent as a provider name.
  allowed_providers: ["*"]
  allow_fallbacks: true
  sensitive_defaults:
    data_collection: deny
    zdr: true
    allow_fallbacks: false

# ---------------------------------------------------------------------------
# Outbound services that must never be contacted.
# Enforced by the HTTP tool egress guard.
# ---------------------------------------------------------------------------
blocked_endpoints:
  - id: onemancompany-talent-market
    reason: "Automatic Talent Market connections are disabled by policy"
    match: ["talent.1mancompany", "talentmarket", "talent-market"]
  - id: wechat
    reason: "WeChat integration is disabled by policy"
    match: ["wechat", "weixin.qq.com", "wx.qq.com"]

# ---------------------------------------------------------------------------
# Telemetry. IronCrew sends no usage analytics anywhere.
# ---------------------------------------------------------------------------
telemetry:
  enabled: false
