name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Guard against hidden or bidi Unicode in workflows
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const workflowDir = path.join(process.cwd(), ".github", "workflows");
          const candidates = fs.existsSync(workflowDir)
            ? fs
                .readdirSync(workflowDir)
                .filter((name) => name.endsWith(".yml") || name.endsWith(".yaml"))
                .map((name) => path.join(workflowDir, name))
            : [];

          const forbiddenRanges = [
            [0x202a, 0x202e], // bidi embedding/override
            [0x2066, 0x2069], // bidi isolates
            [0x200e, 0x200f], // LRM/RLM
            [0x061c, 0x061c], // Arabic letter mark
            [0x200b, 0x200d], // zero-width chars
            [0xfeff, 0xfeff], // BOM/ZWNBSP
          ];

          const findings = [];
          for (const file of candidates) {
            const text = fs.readFileSync(file, "utf8");
            let line = 1;
            let col = 1;
            for (const ch of text) {
              const cp = ch.codePointAt(0);
              const hit = forbiddenRanges.some(([start, end]) => cp >= start && cp <= end);
              if (hit) {
                findings.push({
                  file: path.relative(process.cwd(), file),
                  line,
                  col,
                  cp: `U+${cp.toString(16).toUpperCase().padStart(4, "0")}`,
                });
              }
              if (ch === "\n") {
                line += 1;
                col = 1;
              } else {
                col += 1;
              }
            }
          }

          if (findings.length > 0) {
            console.error("Forbidden hidden/bidi Unicode detected in workflow files:");
            for (const f of findings) {
              console.error(`- ${f.file}:${f.line}:${f.col} ${f.cp}`);
            }
            process.exit(1);
          }

          console.log("Workflow Unicode guard passed.");
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        shell: bash
        run: |
          # `pnpm audit` exits non-zero for two very different reasons: it
          # found a vulnerability, or it could not reach
          # registry.npmjs.org/-/npm/v1/security/audits/quick. That endpoint
          # times out often enough to red the build on an unchanged lockfile,
          # which trains everyone to ignore a security gate.
          #
          # So the two cases are told apart rather than merged. A network
          # failure is retried; a real finding fails immediately and is never
          # retried away. The gate keeps its full strength — this only stops a
          # socket timeout from being reported as a vulnerability.
          set -o pipefail
          attempt=1
          max_attempts=3
          while true; do
            if output=$(pnpm audit --prod --audit-level=high 2>&1); then
              echo "$output"
              exit 0
            fi
            echo "$output"

            if ! grep -qiE 'ERR_SOCKET_TIMEOUT|ETIMEDOUT|ECONNRESET|ENOTFOUND|EAI_AGAIN|FetchError|error \((5[0-9]{2})\)' <<<"$output"; then
              echo "::error::Security audit reported findings (not a network failure)."
              exit 1
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Could not reach the npm audit endpoint after ${max_attempts} attempts."
              exit 1
            fi

            echo "::warning::npm audit endpoint unreachable (attempt ${attempt}/${max_attempts}); retrying."
            attempt=$((attempt + 1))
            sleep $((attempt * 15))
          done

      - name: Run format check
        run: pnpm run format:check

      - name: Run lint
        run: pnpm run lint

      - name: Run OpenAPI contract check
        run: pnpm run openapi:check

      - name: Run type check
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Run build
        run: pnpm run build

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest (web + api) with coverage
        run: pnpm run test:ci:unit
        env:
          CI: true

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-reports
          path: |
            coverage/web
            coverage/api
          if-no-files-found: warn

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - quality
      - unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright E2E tests
        run: pnpm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
