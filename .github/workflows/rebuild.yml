name: IronCrew rebuild
on:
  push:
    branches: ['rebuild/ironcrew']
    paths: ['next/**', '.github/workflows/rebuild.yml']
  pull_request:
    paths: ['next/**', '.github/workflows/rebuild.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: next
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
          package_json_file: next/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26.4.0
          cache: pnpm
          cache-dependency-path: next/pnpm-lock.yaml
      - name: Verify CI tool bootstrap and no-skip parser
        run: python -m unittest discover -s scripts/tests -p 'test_ci_tools.py'
      - name: Install checksum-pinned age and export explicit test executables
        run: python scripts/ci-tools.py "$RUNNER_TEMP/ironcrew-ci-age" --github-env "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Permit user namespaces only for the installed Playwright Chromium
        if: runner.os == 'Linux'
        run: |
          node scripts/ci-chromium-apparmor.ts "$RUNNER_TEMP/ironcrew-chromium.apparmor"
          sudo apparmor_parser -r "$RUNNER_TEMP/ironcrew-chromium.apparmor"
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({ executablePath: chromium.executablePath(), chromiumSandbox: true });
          try {
            const page = await browser.newPage();
            await page.setContent('<title>IronCrew sandbox fixture</title>');
            if (await page.title() !== 'IronCrew sandbox fixture') throw new Error('Sandboxed Chromium did not render');
            console.log('Exact-path AppArmor profile: sandboxed Chromium launch and render passed');
          } finally { await browser.close(); }
          NODE
      - name: Complete release gates, no skipped tests, dependency audit and source integrity
        run: python scripts/verify-local.py --require-tools
      - name: Remove the dedicated Chromium AppArmor profile
        if: always() && runner.os == 'Linux'
        run: |
          if test -f "$RUNNER_TEMP/ironcrew-chromium.apparmor"; then
            sudo apparmor_parser -R "$RUNNER_TEMP/ironcrew-chromium.apparmor"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebuild-evidence-${{ matrix.os }}
          path: |
            next/docs/test-evidence/gates.json
            next/docs/test-evidence/source-manifest.json
            next/docs/test-evidence/*.log
            next/docs/test-evidence/audit.json
            ${{ runner.temp }}/ironcrew-ci-age/ci-tools.json
            ${{ runner.temp }}/ironcrew-chromium.apparmor
            next/playwright-report
            next/test-results
          if-no-files-found: error
