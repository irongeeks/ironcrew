# IronCrew Docker Compose
# Usage:
#   Production:  docker compose --profile prod up --build
#   Development: docker compose --profile dev up --build
#
# The `octooffice-data` volume and the `octooffice.sqlite` file inside it keep
# their pre-rename names on purpose. A named volume is matched by name, and
# DB_PATH here is explicit, so renaming either one would point a running
# container at a brand-new empty database while the real company sat untouched
# in the old volume. Nothing would error — the stack would come up and the
# company would simply be gone. Existing deployments are worth more than a
# consistent label; leave both as they are.

services:
  ironcrew:
    build:
      context: .
      target: production
    profiles: [prod]
    ports:
      - "${BIND_HOST:-127.0.0.1}:8790:8790"
    volumes:
      - octooffice-data:/data
      # Same existing volume, also at the relative runtime data path. This keeps
      # character uploads, vault notes and attachments across container rebuilds.
      - octooffice-data:/app/data
      - ./config:/app/config:ro
      - ./workspaces:/workspaces
    env_file: .env
    environment:
      DB_PATH: /data/octooffice.sqlite
      LOGS_DIR: /data/logs
      OBSIDIAN_VAULT_PATH: "${OBSIDIAN_VAULT_PATH:-/data/vault}"
      HOST: "0.0.0.0"
    restart: unless-stopped

  ironcrew-dev:
    build:
      context: .
      target: dev
    profiles: [dev]
    ports:
      - "${BIND_HOST:-127.0.0.1}:8800:8800"
      - "${BIND_HOST:-127.0.0.1}:8790:8790"
    volumes:
      - .:/app
      - dev-node-modules:/app/node_modules
      - octooffice-data:/data
      # Same existing volume, also at the relative runtime data path. This keeps
      # character uploads, vault notes and attachments across container rebuilds.
      - octooffice-data:/app/data
      - ./config:/app/config:ro
      - ./workspaces:/workspaces
    env_file: .env
    environment:
      DB_PATH: /data/octooffice.sqlite
      LOGS_DIR: /data/logs
      OBSIDIAN_VAULT_PATH: "${OBSIDIAN_VAULT_PATH:-/data/vault}"
      VITE_DEV: "1"
      HOST: "0.0.0.0"

volumes:
  octooffice-data:
  dev-node-modules:
